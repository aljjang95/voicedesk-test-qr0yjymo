name: Claude Code Build

on:
  workflow_dispatch:
    inputs:
      project_title:
        description: '프로젝트 제목'
        required: true
      plan_json:
        description: 'Build plan JSON (escaped)'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: claude-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write build plan to file
        env:
          PLAN_JSON: ${{ github.event.inputs.plan_json }}
          PROJECT_TITLE: ${{ github.event.inputs.project_title }}
        run: |
          mkdir -p .claude
          printf '%s' "$PLAN_JSON" > .claude/build-plan.json
          printf '%s' "$PROJECT_TITLE" > .claude/project-title.txt
          echo "✓ Build plan saved"
          jq -r '.project_name // "(none)"' .claude/build-plan.json || true
          wc -c .claude/build-plan.json

      - name: Compose Claude Code prompt
        id: prompt
        run: |
          cat > .claude/prompt.md <<'PROMPT_EOF'
          [중요] 이 태스크는 GitHub Actions 자동화 환경에서 실행됩니다.
          - 질문 금지. 확인 금지. 바로 코드를 작성하세요.
          - 모든 결정을 스스로 내리세요. "어떻게 할까요?" 같은 되묻기 절대 금지.
          - 빈 리포지토리 (README.md만 존재)에서 시작합니다.
          - npm install && npm run build 가 성공해야 합니다 (자동 검증됨).

          ## 작업
          `.claude/build-plan.json` 파일을 읽어 그 안의 스펙대로 완전한 MVP 프로젝트를 생성하세요.

          ## 빌드 플랜 위치
          `.claude/build-plan.json` — JSON 형식. 다음 필드 포함:
          - project_name, one_liner
          - mvp_spec.core_features, mvp_spec.non_goals, mvp_spec.success_criteria
          - tech_stack (frontend/backend/ai/deploy/reason)
          - week1_plan (Day별 작업)
          - first_revenue_path

          ## 필수 요구사항
          1. **TypeScript strict mode** 필수
          2. **한국어 UI** (존댓말, 존중하는 톤)
          3. **모바일 퍼스트** 반응형
          4. `package.json`, `tsconfig.json`, `next.config.ts`, `postcss.config.js` 등 모든 설정 파일 생성
          5. 모든 페이지/라우트/컴포넌트/타입 파일 작성 (껍데기 금지, 실제 동작 코드)
          6. `README.md` 한국어로 작성 — 실행 방법, 환경변수, 배포 안내
          7. `.env.example` — 필요한 환경변수 목록
          8. `.gitignore` — node_modules, .next, .env*, dist 등
          9. 외부 API 키가 필요한 부분은 환경변수로 분리 + .env.example에 명시
          10. 키 없이도 `npm run build` 성공해야 함 — 빌드 시점 검증은 process.env에 의존하지 않게
          11. 페이지 최소 3개 이상 (홈 + 기능 페이지 2개 이상)
          12. API Route 최소 2개 이상 (각 라우트는 zod로 입력 검증)
          13. UI: Tailwind CSS 4 (PostCSS 설정 포함). shadcn 스타일 카드/버튼 권장
          14. 에러/로딩/빈 상태 처리 UI 포함
          15. 코드 100% 동작. TODO/FIXME/임시 코드 금지.

          ## 작업 흐름
          1. `.claude/build-plan.json`을 Read로 읽어서 spec 파악
          2. 파일 트리 설계 → 한꺼번에 Write로 작성
          3. `npm install` 실행 — 모든 의존성 정상 설치 확인
          4. `npm run build` 실행 — 빌드 성공 확인. 실패하면 코드 수정 후 재실행 (반복)
          5. README.md 작성
          6. 완료
          PROMPT_EOF
          echo "✓ Prompt composed"
          wc -l .claude/prompt.md

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: .claude/prompt.md
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: 'Bash,View,Read,Write,Edit,MultiEdit,Glob,Grep,LS'
          timeout_minutes: '20'
          max_turns: '40'

      - name: Verify build
        id: verify
        run: |
          if [ -f package.json ]; then
            echo "✓ package.json exists"
            npm install --no-audit --no-fund || echo "⚠ npm install warning"
            if grep -q '"build"' package.json; then
              echo "→ npm run build"
              npm run build 2>&1 | tail -50 || echo "⚠ build failed (non-fatal)"
            fi
          else
            echo "⚠ package.json missing"
          fi
        continue-on-error: true

      - name: Commit & push generated files
        if: success() || failure()
        run: |
          git config user.name "Claude Code Bot"
          git config user.email "claude-code-bot@anthropic.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "feat: Claude Code 자동 생성 MVP

            Build plan: ${{ github.event.inputs.project_title }}
            Generated by GitHub Actions + Claude Code CLI
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push origin HEAD
          fi
